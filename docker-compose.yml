version: '3.8'

services:
  web:
    image: mi-sitio-devops:latest
    build: .
    ports:
      - "8080:80"
    # 🔄 Alta disponibilidad: recuperación automática ante fallas
    restart: always
    
    # 🩺 Healthcheck: Monitoreo continuo de salud del contenedor (IE5)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # ⚙️ Límites de desempeño y recursos (IE3 / IE5)
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M