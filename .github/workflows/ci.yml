name: CI/CD Pipeline - DevOps Parcial 2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

    
      #PRUEBAS AUTOMATIZADAS Y POLÍTICAS DE CALIDAD
      - name: Validación Estructural de Código (Prueba estática)
        run: |
          echo "Iniciando validación de políticas de calidad del proyecto..."
          if [ -f "index.html" ] && grep -q "<html" index.html; then
            echo "OK: index.html existe y contiene estructura HTML válida."
          else
            echo "ERROR: index.html no cumple con los estándares de calidad."
            exit 1
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Construir Imagen Temporal para Pruebas (IE1)
        run: |
          docker build -t test-microservice:${{ github.sha }} .

      #ESCANEO DE SEGURIDAD Y GOBERNANZA (Snyk)
      - name: Escaneo de Seguridad de la Imagen con Snyk
        uses: snyk/actions/docker@master
        continue-on-error: false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: test-microservice:${{ github.sha }}
          args: --severity-threshold=high

      # SMOKE TEST / PRUEBA FUNCIONAL
      - name: Ejecución de Smoke Test (Prueba funcional automatizada)
        run: |
          echo "Levantando contenedor en entorno aislado para prueba de integración..."
          docker run -d -p 8080:80 --name container-test test-microservice:${{ github.sha }}
          sleep 3
          http_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          echo "Código HTTP obtenido: $http_status"
          if [ "$http_status" -eq 200 ]; then
            echo "[✔] ÉXITO: La prueba automatizada pasó correctamente."
            # Limpieza de entorno para liberar el puerto 8080
            docker rm -f container-test
          else
            echo "FALLO: El microservicio no respondió con HTTP 200."
            docker rm -f container-test
            exit 1
          fi

      #TRAZABILIDAD Y ETIQUETADO FINAL
      - name: Etiquetado final para Trazabilidad
        run: |
          docker tag test-microservice:${{ github.sha }} mi-sitio-devops:latest
          echo "Imagen validada y lista para despliegue."

      #DESPLIEGUE Y ORQUESTACIÓN 
      - name: Despliegue en entorno cloud simulado con Docker Compose
        run: |
          echo "Iniciando orquestación de contenedores..."
          docker compose up -d
          sleep 5
          echo "Verificando salud de los servicios orquestados..."
          docker compose ps